name: Trigger GitLab DevSecOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger GitLab pipeline
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GITLAB_TRIGGER_TOKEN" ]; then
            echo "GitLab trigger token is missing."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --form "token=$GITLAB_TRIGGER_TOKEN" \
            --form "ref=main" \
            --form "variables[UPSTREAM_COMMIT_SHA]=$GITHUB_COMMIT_SHA" \
            --url "https://gitlab.com/api/v4/projects/87530963/trigger/pipeline"
