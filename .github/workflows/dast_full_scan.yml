name: DAST - ZAP Full Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start Flask application
        run: |
          nohup python -u app1.py > flask.log 2>&1 &
          echo $! > flask.pid

      - name: Wait for Flask application
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5000/; then
              echo "Flask application is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Flask application failed to start."
          cat flask.log
          exit 1

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_full_scan_report

      - name: Display Flask logs
        if: always()
        run: |
          if [ -f flask.log ]; then
            cat flask.log
          fi
