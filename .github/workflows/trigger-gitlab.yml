name: Sync GitHub to GitLab and Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Synchronize GitHub to GitLab
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        run: |
          if [ -z "$GITLAB_PUSH_TOKEN" ]; then
            echo "ERROR: GITLAB_PUSH_TOKEN is missing."
            exit 1
          fi

          git remote add gitlab \
            "https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/Youssefkhalidd/devsecops-lab-app.git"

          git push --force gitlab HEAD:main

      - name: Trigger GitLab security pipeline
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: |
          if [ -z "$GITLAB_TRIGGER_TOKEN" ]; then
            echo "ERROR: GITLAB_TRIGGER_TOKEN is missing."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --form "token=$GITLAB_TRIGGER_TOKEN" \
            --form "ref=main" \
            --url "https://gitlab.com/api/v4/projects/87530963/trigger/pipeline"
