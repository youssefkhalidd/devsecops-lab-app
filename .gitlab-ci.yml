stages:
  - validate
  - test
  - security

python-validation:
  stage: validate
  image: python:3.12-slim
  script:
    - python --version
    - python -m py_compile app1.py

source-diagnostic:
  stage: test
  image: alpine:latest
  script:
    - echo "Pipeline commit is $CI_COMMIT_SHA"
    - echo "Pipeline branch is $CI_COMMIT_REF_NAME"
    - ls -la
    - cat app1.py
    - sha256sum app1.py

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
